  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

Reserve 「」 for readings ONLY — never to quote a phrase; quote Japanese phrases with straight single quotes instead. The unit is the WHOLE WORD including its okurigana: write 考える「かんがえる」 not 考「かんが」える, and 見えています「みえています」 not 見「み」えています.\",\n          \"QUOTING RULE: when you quote the learner's own text back to them, reproduce it EXACTLY as they wrote it — same kanji, same kana, no substitutions, and do NOT append a reading to it. The furigana rule applies only to words YOU introduce.\",\n          \"OUTPUT: respond ONLY with JSON, no markdown fences, no commentary. Keys:\",\n          \"understood (boolean); accurate (\\\"good\\\"|\\\"ok\\\"|\\\"bad\\\"); natural (\\\"good\\\"|\\\"ok\\\"|\\\"bad\\\");\",\n          \"correction (string|null) — the learner's sentence minimally corrected, or null if nothing needs changing;\",\n          \"note (string) — one or two short English sentences: what worked, then the single most useful fix, naming the grammar point or word;\",\n          \"better (string) — one more natural Japanese sentence built from words in the learner's WORDS LIST.\"\n        ].join(\" \"),\n        messages: [{ role: \"user\", content: [\n          \"WORDS LIST (these words are already known — write them with NO reading): \" + this.chatWordsBrief(),\n          \"English examples they were shown (inspiration only): \" + ((this.state.introEgs || []).join(\" / \") || \"none\"),\n          \"Learner's Japanese: \\\"\" + answer + \"\\\".\"\n        ].join(\"\\n\") }]\n      });\n      const json = JSON.parse(String(raw).replace(/^[^{]*/, \"\").replace(/[^}]*$/, \"\"));\n      this._typeLen = String(json.note || \"—\").length + String(json.better || \"—\").length;\n      this.setState({ loading: false, result: json });\n      this.startTyping();\n    } catch (e) {\n      this.setState({ loading: false, result: { natural: false, correction: null, note: \"Check failed — try again.\", better: \"—\" } });\n    }\n  }\n\n  async askQuestion() {\n    const k = setOf(this.state.batch)[this.state.sel];\n    const q = this.state.draft.trim();\n    if (!q || this.state.loading) return;\n    this._typeLen = 0;\n    this.setState({ loading: true, result: null, sent: q, draft: \"\", compStart: 0 });\n    try {\n      const raw = await window.claude.complete({\n        model: this.props.model ?? \"claude-haiku-4-5\",\n        system: [\n          \"You are Ken-Sensei, a patient Japanese teacher helping a JLPT N4 learner.\",\n          \"The learner is asking a question in English about Japanese — grammar, usage, nuance, or one of the words in their WORDS LIST.\",\n          \"Answer in plain English, two or three short sentences, concrete and example-led. No preamble, no lists.\",\n          \"FURIGANA RULE — this is the opposite of what you may expect, follow it exactly. The learner already knows the words in their WORDS LIST, so those words take NO reading: write them bare. Every OTHER word containing kanji — any word not in the WORDS LIST, including verbs, adjectives and nouns you introduce yourself — MUST be followed immediately by its reading in hiragana inside Japanese corner brackets, e.g. 飾る「かざる」. Never use round brackets for readings. Reserve 「」 for readings ONLY — never to quote a phrase; quote Japanese phrases with straight single quotes instead. The unit is the WHOLE WORD including its okurigana: write 考える「かんがえる」 not 考「かんが」える, and 見えています「みえています」 not 見「み」えています.\",\n          \"OUTPUT: respond ONLY with JSON, no markdown fences. Keys: note (string, your answer); better (string, one short Japanese example sentence using a word from their WORDS LIST, or \\\"\\\" if an example would not help).\"\n        ].join(\" \"),\n        messages: [{ role: \"user\", content: [\n          \"WORDS LIST (these words are already known — write them with NO reading): \" + this.chatWordsBrief(),\n          \"Learner's question: \\\"\" + q + \"\\\"\"\n        ].join(\"\\n\") }]\n      });\n      const json = JSON.parse(String(raw).replace(/^[^{]*/, \"\").replace(/[^}]*$/, \"\"));\n      const answer = { understood: true, accurate: undefined, natural: undefined, note: json.note, better: json.better || \"\", ask: true };\n      this._typeLen = String(answer.note || \"\").length + String(answer.better || \"\").length;\n      this.setState({ loading: false, result: answer });\n      this.startTyping();\n    } catch (e) {\n      this.setState({ loading: false, result: { understood: true, note: \"Couldn't answer that — try again.\", better: \"\", ask: true } });\n    }\n  }\n\n  // highlight the English that maps onto this kanji's words\n  splitSentence(k) {\n    const terms = [];\n    k.g.forEach(g => g.w.forEach(w => {\n      w[2].split(\",\").forEach(t => {\n        const s = t.replace(/\\(.*?\\)/g, \"\").replace(/^\\s*(to|a|an|the)\\s+/i, \"\").trim();\n        if (s.length > 2) terms.push(s);\n      });\n    }));\n    if (!terms.length) return [{ text: k.sentence, hit: false, plain: true }];\n    const esc = terms.sort((a, b) => b.length - a.length).map(t => t.replace(/[.*+?^${}()|[\\]\\\\]/g, \"\\\\$&\"));\n    const re = new RegExp(\"\\\\b(\" + esc.join(\"|\") + \")\\\\b\", \"gi\");\n    const out = [];\n    let last = 0, m;\n    while ((m = re.exec(k.sentence)) !== null) {\n      if (m.index > last) out.push({ text: k.sentence.slice(last, m.index), hit: false, plain: true });\n      out.push({ text: m[0], hit: true, plain: false });\n      last = m.index + m[0].length;\n    }\n    if (last < k.sentence.length) out.push({ text: k.sentence.slice(last), hit: false, plain: true });\n    return out;\n  }\n\n  kata2hira(s) {\n    return String(s).replace(/[\\u30a1-\\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));\n  }\n\n  // which slice of a word's furigana belongs to the focus kanji's reading\n  furiSplit(furi, reading) {\n    const VOICE = { \"か\":\"が\",\"き\":\"ぎ\",\"く\":\"ぐ\",\"け\":\"げ\",\"こ\":\"ご\",\"さ\":\"ざ\",\"し\":\"じ\",\"す\":\"ず\",\"せ\":\"ぜ\",\"そ\":\"ぞ\",\"た\":\"だ\",\"ち\":\"ぢ\",\"つ\":\"づ\",\"て\":\"で\",\"と\":\"ど\",\"は\":\"ば\",\"ひ\":\"び\",\"ふ\":\"ぶ\",\"へ\":\"べ\",\"ほ\":\"ぼ\" };\n    const PLOS = { \"は\":\"ぱ\",\"ひ\":\"ぴ\",\"ふ\":\"ぷ\",\"へ\":\"ぺ\",\"ほ\":\"ぽ\" };\n    const UN = {};\n    Object.keys(VOICE).forEach(x => { UN[VOICE[x]] = x; });\n    Object.keys(PLOS).forEach(x => { UN[PLOS[x]] = x; });\n    const cands = [];\n    String(reading).split(\"/\").forEach(part => {\n      const h = this.kata2hira(part.trim());\n      if (!h) return;\n      const bases = [h];\n      const f = h[0];\n      if (VOICE[f]) bases.push(VOICE[f] + h.slice(1));\n      if (PLOS[f]) bases.push(PLOS[f] + h.slice(1));\n      if (UN[f]) bases.push(UN[f] + h.slice(1));\n      bases.forEach(b => {\n        if (cands.indexOf(b) < 0) cands.push(b);\n        if (b.length > 1) {\n          const t = b.slice(0, -1) + \"っ\";\n          if (cands.indexOf(t) < 0) cands.push(t);\n        }\n      });\n    });\n    for (let i = 0; i < cands.length; i++) {\n      const at = furi.indexOf(cands[i]);\n      if (at >= 0) return { pre: furi.slice(0, at), hit: cands[i], post: furi.slice(at + cands[i].length) };\n    }\n    return { pre: furi, hit: \"\", post: \"\" };\n  }\n\n  // quiz and mastered are mutually exclusive: queueing a word un-masters it,\n  // marking it mastered drops it from the quiz\n  // the selected words, described for the model\n  chatWordsBrief() {\n    const sel = this.state.chatSel;\n    const out = [];\n    DATA.forEach(dk => dk.g.forEach(g => g.w.forEach(w => {\n      if (!sel[w[0]] || out.some(x => x.indexOf(w[0] + \"(\") === 0)) return;\n      out.push(w[0] + \"(\" + w[1] + \") = \" + w[2] + \" [kanji \" + dk.c + \"]\");\n    })));\n    return out.length ? out.join(\"; \") : \"empty — the learner has not chosen any words yet\";\n  }\n\n  addWordsToChat(keys, toggle) {\n    if (this._chatFlashT) clearTimeout(this._chatFlashT);\n    this.setState(s => {\n      const sel = Object.assign({}, s.chatSel);\n      if (toggle && keys.length === 1 && sel[keys[0]]) delete sel[keys[0]];\n      else {\n        const allIn = keys.every(k => sel[k]);\n        if (allIn) keys.forEach(k => { delete sel[k]; });\n        else keys.forEach(k => { if (!sel[k] && Object.keys(sel).length < 12) sel[k] = true; });\n      }\n      return { chatSel: sel, chatFlash: true };\n    });\n    this._chatFlashT = setTimeout(() => this.setState({ chatFlash: false }), 620);\n  }\n\n  romaji(kana) {\n    const key = String(kana || \"\");\n    if (ROMA_CACHE[key]) return ROMA_CACHE[key];\n    const hira = key.replace(/[\\u30a1-\\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 96));\n    const out = [];\n    let i = 0;\n    while (i < hira.length) {\n      const two = hira.slice(i, i + 2);\n      if (KANA_D[two]) { out.push({ r: KANA_D[two] }); i += 2; continue; }\n      const c = hira[i];\n      if (c === \"っ\") {\n        const nx = KANA_D[hira.slice(i + 1, i + 3)] || KANA_S[hira[i + 1]] || \"\";\n        out.push({ r: nx.charAt(0) });\n        i += 1;\n        continue;\n      }\n      out.push({ r: KANA_S[c] === undefined ? c : KANA_S[c] });\n      i += 1;\n    }\n    ROMA_CACHE[key] = out;\n    return out;\n  }\n\n  // syllables carrying high pitch, per word — drawn as an overline\n  romaRuns(mora) {\n    const known = mora.length > 0 && !mora[0].unknown;\n    const txt = mora.map(m => m.r).join(\"\\u00a0\");\n    if (!known) return { pitchKnown: false, pitchUnknown: true, romaPlain: txt, romaA: \"\", romaB: \"\", romaC: \"\" };\n    let s = mora.findIndex(m => m.hi);\n    if (s < 0) return { pitchKnown: false, pitchUnknown: true, romaPlain: txt, romaA: \"\", romaB: \"\", romaC: \"\" };\n    let e = s;\n    while (e + 1 < mora.length && mora[e + 1].hi) e++;\n    const seg = (a, b) => mora.slice(a, b).map(m => m.r).join(\"\\u00a0\");\n    return {\n      pitchKnown: true, pitchUnknown: false, romaPlain: \"\",\n      romaA: s > 0 ? seg(0, s) + \"\\u00a0\" : \"\",\n      romaB: seg(s, e + 1),\n      romaC: e + 1 < mora.length ? \"\\u00a0\" + seg(e + 1, mora.length) : \"\"\n    };\n  }\n\n  pitchOf(word, kana) {\n    const ck = word + \"|\" + kana;\n    if (PITCH_CACHE[ck]) return PITCH_CACHE[ck];\n    PITCH_CACHE[ck] = this.pitchCalc(word, kana);\n    return PITCH_CACHE[ck];\n  }\n\n  pitchCalc(word, kana) {\n    const P = PITCH[word];\n    const mora = this.romaji(kana);\n    if (P === undefined) return mora.map(m => ({ r: m.r, hi: false, low: false, unknown: true }));\n    // P = mora index of the accent drop; 0 = heiban (stays high after the first)\n    return mora.map((m, i) => {\n      const hi = P === 0 ? i > 0 : (P === 1 ? i === 0 : i > 0 && i < P);\n      return { r: m.r, hi: hi, low: !hi, unknown: false };\n    });\n  }\n\n  toggleQuizWord(key) {\n    const st = this.state;\n    const has = st.quiz.indexOf(key) >= 0;\n    if (has) { this.setState({ quiz: st.quiz.filter(q => q !== key) }); return; }\n    if (st.quiz.length >= 20) return;\n    const m = Object.assign({}, st.mastered);\n    delete m[key];\n    this.persistMastered(m);\n    this.flash(\"quiz\");\n    if (st.mastered[key]) this.flashMastery();\n    this.setState({ quiz: st.quiz.concat([key]), mastered: m });\n  }\n\n  closeWrite() {\n    if (this.state.writeClosing) return;\n    this.setState({ writeClosing: true });\n    setTimeout(() => this.setState({ write: false, writeClosing: false, view: \"list\", lang: \"ja\", typed: 0, intro: 0, history: [], cand: null, candIdx: 0, draft: \"\", sent: \"\", result: null }), 180);\n  }\n\n  // every route into the chat goes through here so the intro always types\n  openChat(bi, ki) {\n    const kk = setOf(bi)[ki];\n    this.setState({ batch: bi, sel: ki, write: true, writeClosing: false, draft: \"\", sent: \"\", result: null, history: [], kHover: null, introEgs: null });\n    this.makeIntroExamples(kk);\n  }\n\n  // two English example sentences drawn from the current words list\n  async makeIntroExamples(kk) {\n    const sel = Object.keys(this.state.chatSel);\n    if (!sel.length) {\n      this.startIntro(\"To test your comprehension, go back to the table → click word rows to add them to your WORDS LIST and study them here.\".length);\n      return;\n    }\n    const all = [];\n    DATA.forEach(dk => dk.g.forEach(g => g.w.forEach(w => { if (this.state.chatSel[w[0]]) all.push(w); })));\n    const pick = (pool, n) => {\n      const a = pool.slice();\n      const out = [];\n      while (out.length < n && a.length) out.push(a.splice(Math.floor(Math.random() * a.length), 1)[0]);\n      return out;\n    };\n    const g1 = pick(all, 3);\n    const left = all.filter(w => !g1.some(x => x[0] === w[0]));\n    const g2 = pick(left.length >= 2 ? left : all, 3);\n    const LEAD = \"Make any sentence using your words list.\";\n    this.startIntro(LEAD.length);\n    const fallback = [\n      g1.map(w => w[2]).join(\", \") + \" — use these together in one sentence.\",\n      g2.map(w => w[2]).join(\", \") + \" — then try these.\"\n    ];\n    let landed = false;\n    setTimeout(() => {\n      if (landed || !this.state.write || this.state.introEgs) return;\n      this.setState({ introEgs: fallback });\n      this.startIntro((LEAD + fallback.join(\"\")).length, true);\n    }, 4000);\n    try {\n      const raw = await window.claude.complete({\n        model: this.props.model ?? \"claude-haiku-4-5\",\n        system: [\"You write example prompts for a Japanese learner.\",\n          \"Given two groups of Japanese words, write ONE short natural ENGLISH sentence per group that a learner could plausibly translate into Japanese.\",\n          \"THE SENTENCE MUST MAKE SENSE. It has to describe a situation a real person could actually be in: one consistent time frame (never a past event placed in the future, e.g. never 'I heard it tomorrow'), agreeing tense throughout, and a subject that can plausibly do the verb.\",\n          \"Coherence beats coverage: if the words in a group cannot be combined into a sensible sentence, USE ONLY THE ONES THAT FIT and drop the rest. Never bend meaning or invent a contradiction to squeeze a word in.\",\n          \"Keep it concrete and everyday — something the learner might really want to say. 12 words maximum. No Japanese, no quotes, no numbering.\",\n          \"The two sentences must describe different situations.\",\n          \"Reply as JSON only: {\\\"a\\\":\\\"...\\\",\\\"b\\\":\\\"...\\\"}\"].join(\" \"),\n        messages: [{ role: \"user\", content: \"Group 1: \" + g1.map(w => w[0] + \" (\" + w[2] + \")\").join(\", \") + \"\\nGroup 2: \" + g2.map(w => w[0] + \" (\" + w[2] + \")\").join(\", \") }]\n      });\n      const j = JSON.parse(String(raw).replace(/^[^{]*/, \"\").replace(/[^}]*$/, \"\"));\n      landed = true;\n      if (!j.a || !j.b || !this.state.write) return;\n      const egs = [j.a, j.b];\n      this.setState({ introEgs: egs });\n      this.startIntro((LEAD + egs.join(\"\")).length, true);\n    } catch (e) {}\n  }\n\n  // the opening message types itself when the chat opens\n  startIntro(total, keep) {\n    if (this._introT) clearInterval(this._introT);\n    this._introLen = total;\n    if (!keep) this.setState({ intro: 0 });\n    this._introT = setInterval(() => {\n      this.setState(s => {\n        const n = s.intro + 14;\n        if (n >= (this._introLen || 0)) { clearInterval(this._introT); this._introT = null; }\n        return { intro: n };\n      });\n    }, 55);\n  }\n\n  // replies arrive a character at a time, like someone typing\n  startTyping() {\n    if (this._typeT) clearInterval(this._typeT);\n    if (!this._typeLen) return;\n    this.setState({ typed: 0 });\n    this._typeT = setInterval(() => {\n      this.setState(s => {\n        const n = s.typed + 14;\n        if (n >= (this._typeLen || 0)) { clearInterval(this._typeT); this._typeT = null; }\n        return { typed: n };\n      });\n    }, 55);\n  }\n\n  flashMastery() {\n    if (this._masteryT) clearTimeout(this._masteryT);\n    this.setState({ masteryFlash: true });\n    this._masteryT = setTimeout(() => this.setState({ masteryFlash: false }), 700);\n  }\n\n  shuffleA(a) {\n    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }\n    return a;\n  }\n\n  glossOf(kk) { return String(kk.meaning || \"\").split(/,\\s*/)[0]; }\n\n  // A4 portrait sheet of the deck's kanji — logo, glyphs + meanings, no progress marks, no ranges\n  printDeckPdf() {\n    const deck = this.state.deck || \"JLPT N4\";\n    const cells = DATA.map(kk => {\n      const ens = String(kk.meaning || \"\").split(/,\\s*/).slice(0, 2).map(t => t.trim());\n      return '<div class=\"c\"><span class=\"k\">' + kk.c + '<\u002Fspan><span class=\"m\">' + ens.join(\"<br>\") + \"<\u002Fspan><\u002Fdiv>\";\n    }).join(\"\");\n    const html = [\n      '<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>' + deck + \" \\u2014 OpenKanji<\u002Ftitle>\",\n      \"<style>\",\n      \"@page{size:A4 portrait;margin:10mm}\",\n      \"*{box-sizing:border-box}\",\n      'html,body{margin:0;padding:0;background:#ffffff;color:#16232c;font-family:\"Alliance No.2\",\"Alliance No.1\",system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}',\n      \"header{display:flex;align-items:baseline;justify-content:space-between;gap:12mm;padding-bottom:4mm;border-bottom:1px solid #0891b2;margin-bottom:6mm}\",\n      \".brand{display:flex;align-items:center;gap:2.5mm}\",\n      \".mark{width:9mm;height:9mm;display:flex;align-items:center;justify-content:center;background:#0891b2;border:1px solid #0891b2;color:#fff;font-size:5.5mm;line-height:1}\",\n      \".wm{font-size:5mm;letter-spacing:.02em}\",\n      \".wm b{font-weight:400;color:#16232c}.wm i{font-style:normal;color:#0891b2}\",\n      \".deck{font-size:3.4mm;letter-spacing:.16em;text-transform:uppercase;color:#5f7384}\",\n      \".grid{display:grid;grid-template-columns:repeat(10,1fr);border-top:1px solid #9fb4c0;border-left:1px solid #9fb4c0}\",\n      \".c{min-height:30mm;padding:2mm .8mm;display:fle een = {};\n    this.setState({ cQueue: q, cIdx: 0, cShown: false, cDone: 0, cMastered: [], cFlip: !this.state.cFlip, cMove: \"next\" });\n  }\n\n  // one tap/key reveals the back; the next moves on. Seeing a card's back twice\n  // in a session ticks its mastery.\n  cardAdvance(dir) {\n    const st = this.state;\n    const q = st.cQueue || [];\n    if (st.cIdx >= q.length) { if (dir > 0) this.cardRestart(); return; }\n    if (dir < 0) {\n      if (st.cIdx <= 0) return;\n      this.setState({ cIdx: st.cIdx - 1, cShown: true, cMove: \"back\", cFlip: !st.cFlip });\n      return;\n    }\n    const c = q[st.cIdx];\n    if (!c) return;\n    if (!st.cShown) {\n      this._cardSeen = this._cardSeen || {};\n      const times = (this._cardSeen[c.key] || 0) + 1;\n      this._cardSeen[c.key] = times;\n      let mastered = (st.cMastered || []).slice();\n      const first = times === 1;\n      if (times >= 2 && !c.kanji && !st.mastered[c.key] && mastered.indexOf(c.w) < 0) {\n        const m = Object.assign({}, st.mastered, { [c.key]: true });\n        this.persistMastered(m);\n        mastered.push(c.w);\n        this.setState({ mastered: m });\n      }\n      this.setState({ cShown: true, cMove: \"flip\", cFlip: !st.cFlip, cMastered: mastered, cDone: (st.cDone || 0) + (first ? 1 : 0) });\n      return;\n    }\n    this.setState({ cIdx: st.cIdx + 1, cShown: false, cMove: \"next\", cFlip: !st.cFlip });\n  }\n\n  gamePool() {\n    const out = [];\n    const m = this.state.mastered || {};\n    let src = [];\n    if (this.state.gKanji) src = [this.state.gKanji];\n    else if (this.state.gBatch != null) src = DATA.slice(this.state.gBatch * 10, this.state.gBatch * 10 + 10);\n    else src = DATA.slice();\n    src.forEach(kk => {\n      const ks = this.allKeys([kk]);\n      if (ks.length > 0 && ks.every(x => m[x])) return;\n      out.push(kk);\n    });\n    return out;\n  }\n\n  gameWins() {\n    if (!this._gameWins) {\n      try { this._gameWins = JSON.parse(localStorage.getItem(\"openk ok: true }].concat(distract)),\n        reveal: [kk.c + \" \\u00b7 \" + kk.g[0].r + \" \\u00b7 e.g. \" + ex[0] + \"\\u3000\" + ex[1] + \" \\u2014 \" + ex[2]],\n        compare: mode === 2 ? { a: kk.c, aSub: this.glossOf(kk) } : null\n      };\n    }\n    if (mode === 3) {\n      const fake = FAKES[kk.c];\n      if (!fake) return null;\n      this._usedFakes = this._usedFakes || {};\n      if (this._usedFakes[fake[0]]) return null; // never repeat a fake within a session\n      const isCompound = w => /^[\\u4e00-\\u9faf]{2}$/.test(w);\n      const reals = [];\n      const seen = {};\n      const harvest = src => src.g.forEach(g => g.w.forEach(w => {\n        if (reals.length >= 3 || !isCompound(w[0]) || seen[w[0]] || w[0] === fake[0]) return;\n        seen[w[0]] = true;\n        reals.push({ big: w[0], sub: w[2], ok: false });\n      }));\n      harvest(kk);\n      if (reals.length < 3) this.shuffleA(others.slice()).forEach(x => { if (reals.length < 3) harvest(x); });\n      if (reals.length < 3) return null;\n      this._usedFakes[fake[0]] = true;\n      return {\n        mode: 3, kanji: kk.c, prompt: \"tap the made-up word\",\n        grid: true, tiles: this.shuffleA([{ big: fake[0], sub: fake[1], ok: true }].concat(reals)),\n        reveal: [fake[0] + \" is not a real word\"],\n        compare: null\n      };\n    }\n    if (mode === 4) {\n      let word = null;\n      kk.g.forEach(g => g.w.forEach(w => {\n        if (!word && (w[0].match(/[\\u4e00-\\u9faf]/g) || []).length >= 2 && w[1]) word = w;\n      }));\n      if (!word) return null;\n      const runs = this.wordRuns(word[0], word[1]);\n      const variants = [];\n      const slicesAll = [];\n      runs.filter(r => !r.kana).forEach(run => {\n        const slices = this.sliceFuri(run.text, run.furi);\n        slices.forEach(sl => slicesAll.push(sl));\n        slices.forEach(sl => {\n          const entry = DATA.find(x => x.c === sl.ch);\n          if (!entry) return;\n          entry.g.forEach(g => {\n etState({ kpop: false }),\n      kparts: (PARTS[k.c] || { p: [] }).p.map(p => ({ glyph: p[0], gloss: p[1] })),\n      dlgOpen: st.dlg,\n      openDlg: () => this.setState({ dlg: true }),\n      closeDlg: () => this.setState({ dlg: false }),\n      stop: (e) => e.stopPropagation(),\n      seenLabel: st.seen[k.c] ? \"seen it ●\" : \"seen it ○\",\n      toggleSeen: () => {\n        const seen = Object.assign({}, st.seen, { [k.c]: !st.seen[k.c] });\n        this.persist(seen); this.setState({ seen });\n      },\n      draft: st.draft,\n      oneRow: 1,\n      onDraftKey: (e) => {\n        const st2 = this.state;\n        if (st2.cand) {\n          // while candidates are open the composer owns every key\n          e.stopPropagation();\n          if (e.stopImmediatePropagation) e.stopImmediatePropagation();\n          if (/^[0-9]$/.test(e.key)) {\n            const n = parseInt(e.key, 10) - 1;\n            if (n >= 0 && n < st2.cand.list.length) { e.preventDefault(); this.commitCandidate(n); return; }\n          }\n          if (e.key === \" \" || e.key === \"ArrowDown\" || e.key === \"ArrowRight\" || e.key === \"Tab\") {\n            e.preventDefault();\n            this.setState(s => ({ candIdx: (s.candIdx + 1) % s.cand.list.length }));\n            return;\n          }\n          if (e.key === \"ArrowUp\" || e.key === \"ArrowLeft\") {\n            e.preventDefault();\n            this.setState(s => ({ candIdx: (s.candIdx - 1 + s.cand.list.length) % s.cand.list.length }));\n            return;\n          }\n          // with candidates open, Enter always confirms the highlighted one\n          if (e.key === \"Enter\") { e.preventDefault(); this.commitCandidate(st2.candIdx); return; }\n          if (e.key === \"Escape\") { e.preventDefault(); this.setState({ cand: null, candIdx: 0, compStart: 0 }); return; }\n        }\n        if (e.key === \"Enter\" && !e.shiftKey) { e.preventDefault(); this.ask(); }\n      },\n      onDraft: (e) => {\n        if (st.lang === \"en\") { this.setState({ draft: e.target.value, cand: null, candIdx: 0, compStart: 0 }); return; }\n        const draft = this.toKana(e.target.value);\n        const cs = Math.min(this.state.compStart || 0, draft.length);\n        this.setState({ compStart: cs, draft: draft, cand: this.lookupCandidates(draft), candIdx: 0 });\n      },\n      inputHint: st.lang === \"en\" ? \"Ask Ken-Sensei a question...\" : \"日本語で書いてください...\",\n      setLangJa: () => this.setState({ lang: \"ja\", cand: null, candIdx: 0, compStart: 0 }),\n      setLangEn: () => this.setState({ lang: \"en\", cand: null, candIdx: 0, compStart: 0 }),\n      jaBg: st.lang === \"en\" ? \"transparent\" : \"var(--accent)\",\n      jaFg: st.lang === \"en\" ? \"var(--text-accent)\" : \"#ffffff\",\n      enBg: st.lang === \"en\" ? \"var(--accent)\" : \"transparent\",\n      enFg: st.lang === \"en\" ? \"#ffffff\" : \"var(--text-accent)\",\n      candOpen: !!st.cand,\n      candList: st.cand ? st.cand.list.map((w, i) => ({\n        w: w,\n        n: String(i + 1),\n        bg: i === st.candIdx ? \"var(--accent)\" : \"transparent\",\n        fg: i === st.candIdx ? \"#ffffff\" : \"var(--text-body)\",\n        pick: () => this.commitCandidate(i)\n      })) : [],\n      submit: () => this.ask(),\n      sentenceParts: this.splitSentence(k),\n      submitLabel: st.loading ? \"送信中...\" : \"ケン先生に送る\",\n      checkDisabled: st.loading,\n      charCount: st.draft.length + \" chars\",\n      hasResult: !!st.result,\n      r: (() => {\n        const lv = (v) => v === \"good\" ? { pct: \"100%\", color: \"var(--status-ok)\", word: \"good\" }\n          : v === \"ok\" ? { pct: \"60%\", color: \"var(--status-warn)\", word: \"almost\" }\n          : { pct: \"25%\", color: \"var(--status-error)\", word: \"needs work\" };\n        // one line, chosen by the weakest axis that matters\n        const rank = { good: 2, ok: 1, bad: 0 };\n        const acc = rank[r.accurate] === undefined ? 2 : rank[r.accurate];\n        const nat = rank[r.natural] === undefined ? 2 : rank[r.natural];\n        let verdictLine = \"\", verdictColor = \"var(--status-ok)\";\n        if (st.result && !r.ask) {\n          if (r.understood === false) {\n            verdictLine = \"A Japanese speaker wouldn't follow this yet.\";\n            verdictColor = \"var(--status-error)\";\n          } else if (acc === 0) {\n            verdictLine = \"Understandable, but the grammar breaks down.\";\n            verdictColor = \"var(--status-error)\";\n          } else if (acc === 1 && nat <= 1) {\n            verdictLine = \"Understood, with a few slips and a stiff feel.\";\n            verdictColor = \"var(--status-warn)\";\n          } else if (acc === 1) {\n            verdictLine = \"Understood and natural — just a couple of slips.\";\n            verdictColor = \"var(--status-warn)\";\n          } else if (nat === 0) {\n            verdictLine = \"Correct, but no native would phrase it this way.\";\n            verdictColor = \"var(--status-warn)\";\n          } else if (nat === 1) {\n            verdictLine = \"Correct and clear, a little stiff.\";\n            verdictColor = \"var(--status-warn)\";\n          } else {\n            verdictLine = \"Clear, correct and natural.\";\n            verdictColor = \"var(--status-ok)\";\n          }\n        }\n        const verdict = \"\";\n        const note = r.note || \"—\";\n        const better = r.better || \"—\";\n        if (!this._typeLen) this._typeLen = verdict.length + note.length + better.length;\n        const n = st.typed;\n        const rem = n;\n        const rem2 = rem - note.length;\n        return {\n          hasVerdict: !!st.result, verdictLine: verdictLine, verdictColor: verdictColor,\n          ok: false, notOk: false,\n          correction: r.correction || \"—\",\n          note: note, better: better,\n          verdictTyped: verdict.slice(0, Math.max(0, n)),\n          noteTyped: rem > 0 ? note.slice(0, rem) : \"\",\n          betterTyped: rem2 > 0 ? better.slice(
