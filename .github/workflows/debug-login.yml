name: Debug / login endpoint

# Temporary, manual-only diagnostic: calls the live /api/login endpoint and
# prints the raw response, since the sandbox this gets triggered from cannot
# reach openkanji.org directly. Deleted once the "could not send link" issue
# is diagnosed.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/login
        run: |
          curl -sS -i -X POST https://openkanji.org/api/login \
            -H "Content-Type: application/json" \
            -d '{"email":"delivered@resend.dev","lang":"en"}'
          # delivered@resend.dev is Resend's own sandbox recipient: it accepts
          # whenever the key and sending domain are good, and reaches nobody.
          # A failure here is the key or its permissions, not the address.
