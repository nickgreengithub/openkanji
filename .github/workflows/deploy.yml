name: CI / Deploy

# The site is a Worker serving static assets out of dist/, and dist/ is
# gitignored -- the built page never travels with the commit. So a push is not
# a deploy unless something rebuilds and ships it, which is what this does.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; never cancel one half-way.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # The Worker's one dependency (the Anthropic SDK) took ~7 minutes to
          # install on a cold runner, twice per deploy. Cache ~/.npm.
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      # Catches a src/ change committed without rebuilding: index.html is the
      # GitHub Pages target and is committed, so it must match src/.
      - name: index.html is up to date with src/
        run: npm run check

      # `npm ci` takes a flat 7m01s on these runners -- the same 421s every
      # time, which is a fetch timing out and retrying, not a slow download.
      # So skip it: cache the tree itself, keyed on the lockfile.
      - name: Worker dependencies
        id: worker-modules
        uses: actions/cache@v4
        with:
          path: worker/node_modules
          key: ${{ runner.os }}-worker-modules-${{ hashFiles('worker/package-lock.json') }}

      - name: Install Worker dependencies
        if: steps.worker-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: worker

      - name: Worker tests
        run: npm test
        working-directory: worker

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # The Worker's one dependency (the Anthropic SDK) took ~7 minutes to
          # install on a cold runner, twice per deploy. Cache ~/.npm.
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      # Writes index.html and dist/index.html. dist/ is what wrangler uploads.
      - name: Build
        run: npm run build

      - name: Fail if dist/ is empty
        run: test -s dist/index.html

      # The Worker imports the Anthropic SDK; wrangler bundles it from here.
      # `npm ci` takes a flat 7m01s on these runners -- the same 421s every
      # time, which is a fetch timing out and retrying, not a slow download.
      # So skip it: cache the tree itself, keyed on the lockfile.
      - name: Worker dependencies
        id: worker-modules
        uses: actions/cache@v4
        with:
          path: worker/node_modules
          key: ${{ runner.os }}-worker-modules-${{ hashFiles('worker/package-lock.json') }}

      - name: Install Worker dependencies
        if: steps.worker-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: worker

      - name: Deploy Worker and assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action defaults to wrangler 3, which cannot read wrangler.jsonc
          # -- it finds no config, so no `main`, and fails with
          # "Missing entry-point". JSONC config needs wrangler 4.
          wranglerVersion: '4.128.0'
